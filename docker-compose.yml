services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "8000:8000"
    command: uv run uvicorn agent.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
    env_file:
      - path: ./frontend/.env
        required: false
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    command: pnpm dev
