services:
  backend:
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
    command: >
      uv run uvicorn agent.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/src

  frontend:
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
      - /app/.next
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
